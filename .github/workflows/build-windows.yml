name: Build Windows app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt pyinstaller==6.22.3
      - run: ./build-backend.ps1 -Python python
      - run: node tests/backend-smoke.cjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Sarvam-Voice-Windows-x64
          path: release-*/Sarvam-Voice-*.exe
          compression-level: 0
